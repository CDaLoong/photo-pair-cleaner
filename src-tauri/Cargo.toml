[package]
name = "photo-pair-cleaner"
version = "0.7.1"
description = "Browse local photos and safely pair JPG selections with RAW files"
authors = ["FramePair contributors"]
edition = "2024"
license-file = "../LICENSE.md"

[lib]
name = "photo_pair_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
trash = "5"
walkdir = "2"

[dev-dependencies]
