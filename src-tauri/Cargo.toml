[package]
name = "photo-pair-cleaner"
version = "0.1.0"
description = "Safely pair JPG selections with RAW files"
authors = ["FramePair contributors"]
edition = "2024"

[lib]
name = "photo_pair_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "5"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

