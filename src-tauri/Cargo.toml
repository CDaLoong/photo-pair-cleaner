[package]
name = "photo-pair-cleaner"
version = "0.8.0"
description = "Browse local photos and safely pair JPG selections with RAW files"
authors = ["FramePair contributors"]
edition = "2024"
license-file = "../LICENSE.md"

[lib]
name = "photo_pair_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cosmic-text = "0.19.0"
fs2 = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "=0.26.2", default-features = false }
little_exif = "0.6.23"
moxcms = "0.8.1"
quick-xml = "0.38"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tempfile = "3"
trash = "5"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSString", "NSURL"] }

[dev-dependencies]
